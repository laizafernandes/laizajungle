services:
  postgres:
    image: postgres:16.4-alpine
    container_name: jungle-wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jungle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jungle_secret}
      POSTGRES_DB: ${DB_NAME:-jungle_wagering}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jungle} -d ${DB_NAME:-jungle_wagering}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  localstack:
    image: localstack/localstack:3.7.2
    container_name: jungle-wagering-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_WAGER_QUEUE_NAME: ${SQS_WAGER_QUEUE_NAME:-wager-transactions.fifo}
      SQS_WAGER_DLQ_NAME: ${SQS_WAGER_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name ${SQS_WAGER_QUEUE_NAME:-wager-transactions.fifo} >/dev/null 2>&1 && awslocal sqs get-queue-url --queue-name ${SQS_WAGER_DLQ_NAME:-wager-transactions-dlq.fifo} >/dev/null 2>&1 && awslocal sqs get-queue-url --queue-name ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo} >/dev/null 2>&1",
        ]
      interval: 3s
      timeout: 5s
      retries: 25
      start_period: 5s

volumes:
  postgres_data:
